<style>
  :root{
    --ink:#0D1512; --ink-soft:#182420; --ink-line:#1E2E28; --ink-line-hi:#2A3E36;
    --emerald:#10B981; --emerald-deep:#059669;
    --text-light:#F1EEE7; --text-dim:#93A39B;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink); color:var(--text-light); font-family:'Inter',sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(ellipse 70% 40% at 50% -5%, rgba(16,185,129,0.10), transparent 70%);
    background-repeat:no-repeat;
  }
  .wrap{ max-width:520px; margin:0 auto; padding:20px 20px 60px; }

  /* ---- Header ---- */
  .topbar{ border-bottom:1px solid var(--ink-line); background:rgba(13,21,18,0.85); position:sticky; top:0; z-index:10; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .topbar-in{ max-width:520px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-icon{
    width:30px; height:30px; border-radius:9px; background:var(--emerald);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-icon svg{ width:17px; height:17px; color:var(--ink); }
  .brand-name{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; letter-spacing:0.02em; }
  .tagline{ color:var(--text-dim); font-size:13.5px; margin:0 0 22px; }

  /* ---- Filter chips ---- */
  .filters{
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
    margin:0 -20px 24px; padding:0 20px;
  }
  .filters::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; border:1px solid var(--ink-line); background:var(--ink-soft); color:var(--text-dim);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:8px 15px;
    border-radius:999px; cursor:pointer; transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip.active{ background:var(--emerald-deep); border-color:var(--emerald-deep); color:#fff; }

  /* ---- Sections ---- */
  .group{ margin-bottom:26px; }
  .group-head{ display:flex; align-items:center; gap:8px; margin:0 2px 12px; }
  .group-icon{
    width:22px; height:22px; border-radius:7px; background:var(--ink-soft); border:1px solid var(--ink-line);
    display:flex; align-items:center; justify-content:center; color:var(--emerald); flex-shrink:0;
  }
  .group-icon svg{ width:12px; height:12px; }
  .group-title{
    font-size:11.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim);
  }
  .group-count{ font-size:11.5px; color:var(--text-dim); opacity:.6; margin-left:auto; }

  .tools{ display:flex; flex-direction:column; gap:10px; }
  .tool-card{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
    background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:16px;
    padding:14px 14px 14px 14px; transition:border-color 0.15s ease, transform 0.1s ease;
  }
  .tool-card:active{ transform:scale(0.98); }
  .tool-card:hover{ border-color:var(--ink-line-hi); }
  .tool-icon{
    width:46px; height:46px; border-radius:13px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .tool-icon svg{ width:23px; height:23px; }
  .tool-icon.solid{ background:var(--emerald-deep); }
  .tool-icon.solid svg{ color:#fff; }
  .tool-icon.dark{ background:var(--ink); border:1px solid var(--ink-line); }
  .tool-icon.dark svg{ color:var(--emerald); }
  .tool-icon.igpost{ background:linear-gradient(135deg,#f09433,#dc2743 55%,#bc1888); color:#fff; }
  .tool-icon.igpost svg{ color:#fff; }
  .tool-icon.brat{ background:#8ACE00; color:#0D1512; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; }
  .tool-body{ flex:1; min-width:0; }
  .tool-top{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .tool-name{ font-family:'Space Grotesk',sans-serif; font-size:15.5px; font-weight:600; }
  .tool-desc{ color:var(--text-dim); font-size:12.5px; line-height:1.4; }
  .tool-arrow{ color:var(--text-dim); flex-shrink:0; }
  .tool-arrow svg{ width:18px; height:18px; }

  .badge{
    font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:6px; white-space:nowrap;
    background:var(--ink); border:1px solid var(--ink-line); color:var(--text-dim);
  }
  .badge.free{ color:var(--emerald); border-color:rgba(16,185,129,0.3); background:rgba(16,185,129,0.07); }

  .empty{ text-align:center; color:var(--text-dim); font-size:13px; padding:30px 0; }
  .nf{ text-align:center; padding:70px 0 20px; }
  .nf-code{ font-family:'Space Grotesk',sans-serif; font-size:76px; font-weight:700; color:var(--emerald); margin:0; line-height:1; }
  .nf-title{ font-family:'Space Grotesk',sans-serif; font-size:20px; margin:14px 0 8px; }
  .nf-text{ color:var(--text-dim); font-size:13.5px; margin:0 0 22px; }
  .nf-btn{ display:inline-block; background:var(--emerald-deep); color:#fff; text-decoration:none; font-weight:600; font-size:13.5px; padding:10px 20px; border-radius:999px; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="/" style="text-decoration:none;color:inherit">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
        </div>
        <div class="brand-name">MINI TOOLS</div>
      </a>
    </div>
  </header>
  <div class="wrap"><main class="nf">
    <p class="nf-code" aria-hidden="true">404</p>
    <h1 class="nf-title">Halaman tidak ditemukan</h1>
    <p class="nf-text">Alamat yang kamu buka tidak ada atau sudah dipindah.</p>
    <a class="nf-btn" href="/">Kembali ke daftar tools</a>
  </main></div>
</body>
